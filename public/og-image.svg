<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1100" cy="100" r="300" fill="#7c3aed" opacity="0.15" filter="blur(60px)" />
  <circle cx="150" cy="550" r="250" fill="#06b6d4" opacity="0.15" filter="blur(50px)" />

  <g transform="translate(100, 100)">
    <!-- Badge -->
    <rect width="260" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="22" r="6" fill="#06b6d4" />
    <text x="42" y="27" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">PRACTICAL DIGITAL SKILLS</text>

    <!-- Brand name -->
    <text x="0" y="110" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="64" font-weight="800">SkillSprint <tspan fill="url(#text-grad)">India</tspan></text>
    
    <!-- Tagline -->
    <text x="0" y="180" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="44" font-weight="700">Learn Skills. Build Your Career.</text>
    
    <!-- Description -->
    <text x="0" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="24" font-weight="400">Master Digital Marketing, AI Tools, Social Media, Canva &amp; Freelancing</text>
    <text x="0" y="275" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="24" font-weight="400">Designed specifically for Indian college students, freshers &amp; beginners.</text>

    <!-- Feature tags -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="180" height="48" rx="10" fill="#1e293b" />
      <text x="24" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Digital Marketing</text>

      <rect x="200" y="0" width="140" height="48" rx="10" fill="#1e293b" />
      <text x="224" y="30" fill="#c084fc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">AI Tools</text>

      <rect x="360" y="0" width="180" height="48" rx="10" fill="#1e293b" />
      <text x="384" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Social Media</text>

      <rect x="560" y="0" width="160" height="48" rx="10" fill="#1e293b" />
      <text x="584" y="30" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Freelancing</text>
    </g>
  </g>
</svg>
